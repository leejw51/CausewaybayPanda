[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Causewaybay"]

[workspace.dependencies]
causewaybay-panda-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
