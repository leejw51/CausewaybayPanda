[workspace]
resolver = "2"
members = ["crates/protocol", "crates/core", "crates/server", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Causewaybay"]

[workspace.dependencies]
causewaybay-panda-protocol = { path = "crates/protocol" }
causewaybay-panda-core = { path = "crates/core" }
# Must match the installed `wasm-bindgen` CLI exactly.
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Small and tight: the engine ships to a browser tab, and a cafe's server does
# not need the last few percent of speed.
[profile.release]
opt-level = "s"
lto = true
