[package]
name = "causewaybay-panda-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Causewaybay Panda cafe server: axum + SQLite + JSON WebSocket"

[[bin]]
name = "panda"
path = "src/main.rs"

[dependencies]
causewaybay-panda-protocol.workspace = true
causewaybay-panda-core.workspace = true
causewaybay-panda-ai.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
if-addrs = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
http-body-util = "0.1"
